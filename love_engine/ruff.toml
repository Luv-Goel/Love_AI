lint.ignore = ["F405", "E402", "E501", "F403"]
lint.extend-select = ["E501", "T20", "PGH004", "RUF008", "RUF009", "RUF100"]
# RUF100 (unused-noqa) only knows the rules enabled in THIS config, so it would strip
# `# noqa` directives that protect rules enforced elsewhere. List those codes as external
# so RUF100 leaves their directives alone: the strict gate (ruff-strict.toml) and upstream
# love_engine's own ruff config both rely on suppressions this config can't see.
lint.external = [
    # Enforced by the strict-rule gate (scripts/ruff_strict_gate.py + ruff-strict.toml)
    "C901",
    # Enforced by upstream love_engine's ruff config, but not run in this repo's CI
    "PLC0415", "E402", "BLE001", "ARG002", "S102", "S324", "S606", "D401", "F403", "F405",
]
line-length = 120
exclude = ["love_engine/types/*", "love_engine/__init__.py", "love_engine/proxy/example_config_yaml/*", "tests/*"]


[lint.per-file-ignores]
"love_engine/main.py" = ["F401"]
"love_engine/utils.py" = ["F401"]
"love_engine/proxy/proxy_server.py" = ["F401"]
"love_engine/caching/__init__.py" = ["F401"]
"love_engine/llms/anthropic/chat/__init__.py" = ["F401"]
"love_engine/llms/azure_ai/embed/__init__.py" = ["F401"]
"love_engine/llms/azure_ai/rerank/__init__.py" = ["F401"]
"love_engine/llms/bedrock/chat/__init__.py" = ["F401"]
"love_engine/proxy/utils.py" = ["F401"]
