[project]
name = "love_engine-proxy-extras"
version = "0.4.74"
description = "Additional files for the love_engine Proxy. Reduces the size of the main love_engine package."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BerriAI" },
]

[project.urls]
Homepage = "https://love_engine.ai"
Repository = "https://github.com/BerriAI/love_engine"
Documentation = "https://docs.love_engine.ai"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""

[tool.commitizen]
version = "0.4.74"
version_files = [
    "pyproject.toml:^version",
    "../pyproject.toml:love_engine-proxy-extras==",
]
